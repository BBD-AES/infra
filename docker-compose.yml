services:
  gateway:
    image: ${DOCKERHUB_USERNAME}/bbd-gateway:latest
    container_name: bbd-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      USER_SERVICE_URI: http://bbd-user:8080
      ITEM_SERVICE_URI: http://bbd-item:8080
      INVENTORY_SERVICE_URI: http://bbd-inventory:8080
      PROCUREMENT_SERVICE_URI: http://bbd-procurement:8080
      SALES_SERVICE_URI: http://bbd-sales:8080
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED}
      SECURITY_LOG_LEVEL: ${SECURITY_LOG_LEVEL}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL}
    restart: always

  user:
    image: ${DOCKERHUB_USERNAME}/bbd-user:latest
    container_name: bbd-user
    ports:
      - "${USER_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_ENDPOINT: ${USER_DB_ENDPOINT}
      DB_NAME: ${USER_DB_NAME}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      REDIS_HOST: ${LOCAL_REDIS_HOST}
      REDIS_PORT: ${LOCAL_REDIS_PORT}
      REDIS_SSL_ENABLED: false
      USER_SNAPSHOT_CACHE_TTL_SECONDS: ${USER_SNAPSHOT_CACHE_TTL_SECONDS}
      SCIM_ENABLED: ${SCIM_ENABLED}
      SCIM_CLIENT_COMMON_NAME: ${SCIM_CLIENT_COMMON_NAME}
    depends_on:
      - redis
    restart: always

  item:
    image: ${DOCKERHUB_USERNAME}/bbd-item:latest
    container_name: bbd-item
    ports:
      - "${ITEM_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_ENDPOINT: ${ITEM_DB_ENDPOINT}
      DB_NAME: ${ITEM_DB_NAME}
      DB_PASSWORD: ${ITEM_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ELASTICSEARCH_URI: http://bbd-elasticsearch:9200
      REDIS_URI: ${LOCAL_REDIS_HOST}
      REDIS_HOST: ${LOCAL_REDIS_HOST}
      REDIS_PORT: ${LOCAL_REDIS_PORT}
      REDIS_SSL_ENABLED: false
    depends_on:
      - redis
      - elasticsearch
    restart: always

  inventory:
    image: ${DOCKERHUB_USERNAME}/bbd-inventory:latest
    container_name: bbd-inventory
    ports:
      - "${INVENTORY_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_ENDPOINT: ${INVENTORY_DB_ENDPOINT}
      DB_NAME: ${INVENTORY_DB_NAME}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      ITEM_SERVICE_BASE_URL: http://bbd-item:8080/item
      ITEMS_BASE_URL: http://bbd-item:8080/item
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${INVENTORY_KAFKA_CONSUMER_GROUP_ID}
      KAFKA_OFFSET_RESET: ${INVENTORY_KAFKA_OFFSET_RESET}
    depends_on:
      - item
    restart: always

  procurement:
    image: ${DOCKERHUB_USERNAME}/bbd-procurement:latest
    container_name: bbd-procurement
    ports:
      - "${PROCUREMENT_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_ENDPOINT: ${PROCUREMENT_DB_ENDPOINT}
      DB_NAME: ${PROCUREMENT_DB_NAME}
      DB_PASSWORD: ${PROCUREMENT_DB_PASSWORD}
      ITEM_SERVICE_BASE_URL: http://bbd-item:8080/item
      SALES_SERVICE_BASE_URL: http://bbd-sales:8080/sales
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=30.0"
    depends_on:
      - item
      - sales
    restart: always

  sales:
    image: ${DOCKERHUB_USERNAME}/bbd-sales:latest
    container_name: bbd-sales
    ports:
      - "${SALES_PORT}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_ENDPOINT: ${SALES_DB_ENDPOINT}
      DB_NAME: ${SALES_DB_NAME}
      DB_PASSWORD: ${SALES_DB_PASSWORD}
      DB_SCHEMA: ${SALES_DB_SCHEMA}
      SQL_INIT_MODE: ${SALES_SQL_INIT_MODE}
      DEFER_DATASOURCE_INITIALIZATION: ${SALES_DEFER_DATASOURCE_INITIALIZATION}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${SALES_KAFKA_CONSUMER_GROUP_ID}
      KAFKA_OFFSET_RESET: ${SALES_KAFKA_OFFSET_RESET}
      INVENTORY_BASE_URL: http://bbd-inventory:8080/inventory
      ITEM_BASE_URL: http://bbd-item:8080/item
    depends_on:
      - inventory
      - item
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: bbd-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
      - "${ELASTICSEARCH_TRANSPORT_PORT}:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: bbd-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://bbd-elasticsearch:9200
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  redis:
    image: redis:${REDIS_IMAGE_VERSION}
    container_name: bbd-redis
    ports:
      - "${LOCAL_REDIS_PORT}:6379"
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  elasticsearch-data: